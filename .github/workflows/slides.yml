name: slides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка стабильного окружения Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Сборка слайдов официальным Marp CLI с флагом --html (чтобы работали боксы def и warn)
      - name: Build presentation with Marp CLI
        run: |
          npx --yes @marp-team/marp-cli@latest --html Презентация_План_СТРПО.md -o index.html

      # Подготовка файлов: копия для задания 8 и папка для GitHub Pages (задание 10)
      - name: Prepare site and artifacts
        run: |
          mkdir -p _site
          cp index.html slides.html
          mv index.html _site/
          cp -r pic _site/

      # Задание 8: Загрузка артефакта slides.html
      - name: Upload slides artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: slides.html

      # Задание 10: Подготовка артефакта для GitHub Pages
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4