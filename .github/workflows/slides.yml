name: slides

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сборка презентации через официальный action Marp
      - name: Build Marp Presentation to HTML
        uses: marp-team/marp-action@v3
        with:
          args: Презентация_План_СТРПО.md -o index.html

      # Также делаем копию slides.html для артефакта задания №8
      - name: Prepare artifacts
        run: |
          mkdir -p _site
          cp index.html slides.html
          mv index.html _site/
          cp -r pic _site/

      # Задание 8: Загрузка артефакта slides.html (будет доступен для скачивания)
      - name: Upload slides artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: slides.html

      # Задание 10: Подготовка артефакта для GitHub Pages
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4